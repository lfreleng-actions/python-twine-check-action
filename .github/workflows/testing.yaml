---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Action Testing"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Perform setup prior to running test(s)
      - name: "Checkout sample project repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "lfreleng-actions/test-python-project"
          path: "test-python-project"

      - name: "Setup Python"
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "test-python-project/pyproject.toml"

      - name: "Build sample Python project"
        shell: bash
        run: |
          # Build sample Python project
          pip --disable-pip-version-check install build
          cd test-python-project
          python -m build

      # setup-uv runs the interpreter 'uv python find' picks in its
      # working directory and reads uv settings there, which once was the
      # caller's workspace. Plant, in the workspace and the path_prefix
      # used below, a .venv and a .python-version whose interpreters only
      # record that they ran, and a uv.toml no uv can satisfy, so the
      # runs below fail if the action uses any of them.
      - name: "Plant workspace .venv, .python-version and uv.toml"
        shell: bash
        run: |
          # Plant workspace .venv, .python-version and uv.toml
          marker="${RUNNER_TEMP}/planted-ran"
          for dir in "${GITHUB_WORKSPACE}" \
            "${GITHUB_WORKSPACE}/test-python-project"; do
            mkdir -p "${dir}/.venv/bin" "${dir}/.planted-python/bin"
            printf 'home = /usr/bin\nversion = 3.12.0\n' \
              > "${dir}/.venv/pyvenv.cfg"
            for exe in "${dir}/.venv/bin/python3" "${dir}/.venv/bin/python" \
              "${dir}/.planted-python/bin/python3"; do
              printf '#!/bin/sh\necho "%s $*" >> "%s"\nexit 1\n' \
                "${exe}" "${marker}" > "${exe}"
              chmod +x "${exe}"
            done
            printf '%s\n' "${dir}/.planted-python/bin/python3" \
              > "${dir}/.python-version"
            {
              echo 'cache-dir = "/nonexistent/planted-cache"'
              echo 'required-version = "==0.0.1"'
            } > "${dir}/uv.toml"
          done

      - name: "Run Action: ${{ github.repository }}"
        uses: $/
        with:
          path: "test-python-project/dist"

      - name: "Run Action: ${{ github.repository }} [PATH PREFIX]"
        uses: $/
        with:
          path_prefix: "test-python-project"
          path: "dist"

      # Both runs above passed twine check; neither may have started a
      # planted interpreter.
      - name: "Check no planted interpreter ran"
        shell: bash
        run: |
          # Check no planted interpreter ran
          if [ -e "${RUNNER_TEMP}/planted-ran" ]; then
            echo "Error: the action ran a planted workspace interpreter ❌"
            cat "${RUNNER_TEMP}/planted-ran"
            exit 1
          fi
          echo "No planted interpreter ran ✅"

  # A composite action inherits the caller's environment. Plant, the way
  # an earlier caller step could through GITHUB_PATH and GITHUB_ENV,
  # bait interpreters, stdlib-named modules and hostile Python/uv
  # settings; the action must run none of them, cold or warm.
  isolation:
    name: "Workspace Isolation"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        selector: [request, active-environment]
    steps:
      - name: "Checkout sample project repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "lfreleng-actions/test-python-project"
          path: "test-python-project"

      - name: "Setup Python"
        id: setup-python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "test-python-project/pyproject.toml"

      - name: "Build sample Python project"
        shell: bash
        env:
          REAL_PYTHON: "${{ steps.setup-python.outputs.python-path }}"
        run: |
          # Build sample Python project
          "$REAL_PYTHON" -m pip --disable-pip-version-check install build
          cd test-python-project
          "$REAL_PYTHON" -m build

      - name: "Plant bait and hostile settings"
        shell: bash
        env:
          SELECTOR: "${{ matrix.selector }}"
        run: |
          # Plant bait and hostile settings
          marker="${RUNNER_TEMP}/planted-ran"
          ws="${GITHUB_WORKSPACE}"
          mkdir -p "${ws}/.venv/bin" "${ws}/.venv/conda-meta" \
            "${ws}/xdg-bin" "${ws}/pkg/urllib" "${ws}/urllib"
          printf 'home = /usr/bin\nversion = 3.13.0\n' \
            > "${ws}/.venv/pyvenv.cfg"
          for exe in .venv/bin/python .venv/bin/python3 \
            .venv/bin/python3.13 .venv/bin/uv xdg-bin/env xdg-bin/bash; do
            printf '#!/bin/sh\necho "%s $*" >> "%s"\nexit 1\n' \
              "${exe}" "${marker}" > "${ws}/${exe}"
            chmod +x "${ws}/${exe}"
          done
          for mod in json.py base64.py sitecustomize.py usercustomize.py \
            urllib/__init__.py startup.py; do
            for dir in "${ws}" "${ws}/pkg"; do
              printf 'with open(%s, "a") as f:\n    f.write("import %s\\n")\n' \
                "'${marker}'" "${dir}/${mod}" > "${dir}/${mod}"
            done
          done
          case "${RUNNER_ARCH}" in
            ARM64) arch=aarch64 ;;
            *) arch=x86_64 ;;
          esac
          bait="${ws}/.venv/bin/python3"
          # The runner puts GITHUB_PATH entries ahead of PATH, so a PATH=
          # line in GITHUB_ENV would sit behind setup-python's directory.
          echo "${ws}/.venv/bin" >> "${GITHUB_PATH}"
          {
            echo "PYTHONPATH=pkg:."
            echo "PYTHONHOME=${ws}/.venv"
            echo "PYTHONUSERBASE=${ws}/pkg"
            echo "PYTHONSTARTUP=${ws}/startup.py"
            echo "PYTHONEXECUTABLE=${bait}"
            echo "__PYVENV_LAUNCHER__=${bait}"
            echo "UV_NO_CACHE=1"
            echo "UV_PYTHON_ARCH=${arch}"
            echo "UV_PYTHON_INSTALL_MIRROR=https://127.0.0.1:9"
            echo "XDG_BIN_HOME=${ws}/xdg-bin"
            if [ "${SELECTOR}" = "request" ]; then
              echo "UV_PYTHON=${bait}"
              echo "UV_PYTHON_SEARCH_PATH=${ws}/.venv/bin"
              echo "UV_PYTHON_INSTALL_DIR=${ws}/uv-python"
              echo "UV_PYTHON_PREFERENCE=only-system"
            else
              # UV_PYTHON stays unset: it would mask the active environment
              echo "VIRTUAL_ENV=${ws}/.venv"
              echo "CONDA_PREFIX=${ws}/.venv"
              echo "CONDA_DEFAULT_ENV=base"
              echo "UV_INTERNAL__PARENT_INTERPRETER=${bait}"
              echo "UV_INTERNAL__TEST_PYTHON_MANAGED=${ws}/.venv/bin"
              echo "UV_CACHE_DIR=${ws}/uv-cache"
            fi
          } >> "${GITHUB_ENV}"

      # Control: prove the bait is live, so a clean verify step means
      # the action avoided it rather than that it could never fire.
      - name: "Control: bait runs without isolation"
        shell: bash
        env:
          REAL_PYTHON: "${{ steps.setup-python.outputs.python-path }}"
        run: |
          # Control: bait runs without isolation
          marker="${RUNNER_TEMP}/planted-ran"
          python3 --version || true
          env -u PYTHONHOME "$REAL_PYTHON" -c 'import json' || true
          if ! grep -q '/python3 ' "${marker}" \
            || ! grep -q 'import .*/json.py' "${marker}"; then
            echo "Error: the planted bait did not run ❌"
            cat "${marker}" 2>/dev/null || true
            exit 1
          fi
          echo "Planted bait is live ✅"
          rm -f "${marker}"

      - name: "Run Action: cold"
        id: cold
        uses: $/
        with:
          path: "test-python-project/dist"

      - name: "Run Action: warm"
        id: warm
        uses: $/
        with:
          path_prefix: "test-python-project"
          path: "dist"

      - name: "Verify no bait ran"
        if: always()
        shell: bash
        env:
          COLD: "${{ steps.cold.outcome }}"
          WARM: "${{ steps.warm.outcome }}"
        run: |
          # Verify no bait ran
          failed=0
          if [ -e "${RUNNER_TEMP}/planted-ran" ]; then
            echo "Error: the action ran planted bait ❌"
            cat "${RUNNER_TEMP}/planted-ran"
            failed=1
          fi
          case ":${PATH}:" in
            *":${GITHUB_WORKSPACE}/xdg-bin:"*)
              echo "Error: the caller's XDG_BIN_HOME is on PATH ❌"
              failed=1 ;;
          esac
          # The action has no outputs; a passing twine check is its result
          if [ "${COLD}" != "success" ] || [ "${WARM}" != "success" ]; then
            echo "Error: action runs did not succeed (${COLD}/${WARM}) ❌"
            failed=1
          fi
          [ "${failed}" -eq 0 ] || exit 1
          echo "No bait ran; both action runs passed ✅"
