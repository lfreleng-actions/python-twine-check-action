---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# python-twine-check-action
name: "📦 Verify Build Artefacts with Twine"
description: "Verifies Python build artefacts prior to package publishing"
# Call prior to package publishing to validate filenames/content

inputs:
  # Optional
  PATH:
    description: "Directory/folder containing Python build artefacts"
    required: false
    # type: string
    default: "dist"
  PATH_PREFIX:
    description: "Directory location containing project code"
    # type: string
    required: false

runs:
  using: "composite"
  steps:
    - name: "Setup action/environment"
      id: setup
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.PATH_PREFIX }}
      run: |
        # Setup action/environment
        # Handle path_prefix input consistently and when absent
        path_prefix="$INPUT_PATH_PREFIX"
        if [ -z "$path_prefix" ]; then
          # Set current directory as path prefix
          path_prefix="."
        else
          # Strip any trailing slash in provided path
          path_prefix="${path_prefix%/}"
        fi
        # Verify is a valid directory path
        if [ ! -d "$path_prefix" ]; then
          echo "Error: invalid path/prefix to project directory ❌"; exit 1
        fi
        # path_prefix derives from a user-controlled input, so emit it
        # using the documented multiline-delimiter form: a value
        # containing a newline cannot append additional output keys
        # (output-injection hardening).
        delimiter="ghadelimiter_${RANDOM}${RANDOM}${RANDOM}"
        {
          printf '%s<<%s\n' "path_prefix" "$delimiter"
          printf '%s\n' "$path_prefix"
          printf '%s\n' "$delimiter"
        } >> "$GITHUB_OUTPUT"

    # The uv version comes from a requirements file so Dependabot
    # maintains it; pinning the action alone would still leave the uv
    # binary floating.
    #
    # A composite action inherits the caller's environment, so caller
    # variables (PATH, UV_PYTHON, VIRTUAL_ENV and others) could steer
    # uv to an interpreter from the workspace. setup-uv's only uv call
    # for these inputs is "uv python find", whose result it executes.
    # An invalid preference makes uv refuse its arguments before any
    # lookup; setup-uv then reports the Python version as "unknown",
    # which nothing reads.
    - name: "Install uv"
      id: setup-uv
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version-file: "${{ github.action_path }}/requirements/uv.txt"
        working-directory: "${{ github.action_path }}"
        # Without it setup-uv puts the caller's HOME/XDG_* bin dir on PATH
        tool-bin-dir: "${{ runner.temp }}/python-twine-check-action/bin"
        # The post-step "uv cache prune" would hit the invalid preference
        enable-cache: false
      env:
        UV_NO_CONFIG: '1'
        UV_NO_PROJECT: '1'
        UV_PYTHON_PREFERENCE: 'lookup-disabled'
        # Inherited, it makes setup-uv probe uv, which the line above fails
        UV_PYTHON_ARCH: ''
        # yamllint disable-line rule:line-length
        UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/python-twine-check-action/python"

    # A trusted interpreter: uv installs its own pinned, hash-checked
    # build. uv runs with an empty environment plus an allow-list, so
    # no caller variable can pick or redirect the interpreter.
    - name: "Install Python"
      id: python
      shell: bash
      working-directory: "${{ github.action_path }}"
      env:
        UV: "${{ steps.setup-uv.outputs.uv-path }}"
        INSTALL_DIR: "${{ runner.temp }}/python-twine-check-action/python"
        CACHE_DIR: "${{ runner.temp }}/python-twine-check-action/cache"
        PYTHON_VERSION: '3.13'
      run: |
        # Install Python
        clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
          "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR" "UV_CACHE_DIR=$CACHE_DIR")
        for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
            https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
            UV_NATIVE_TLS; do
          if [ -n "${!name+set}" ]; then clean+=("$name=${!name}"); fi
        done
        env -i "${clean[@]}" "$UV" python install --quiet --no-bin \
          "$PYTHON_VERSION"
        PYTHON=$(env -i "${clean[@]}" "$UV" python find --managed-python \
          "$PYTHON_VERSION")
        case "$PYTHON" in
          "$INSTALL_DIR"/*) ;;
          *) echo "Error: uv found Python outside its install directory ❌"
             exit 1 ;;
        esac
        echo "path=$PYTHON" >> "$GITHUB_OUTPUT"

    - name: "Verify Python build artefacts with Twine"
      shell: bash
      env:
        ENV_PATH_PREFIX: "${{ steps.setup.outputs.path_prefix }}"
        INPUT_PATH: "${{ inputs.path }}"
        UV: "${{ steps.setup-uv.outputs.uv-path }}"
        BASE_PYTHON: "${{ steps.python.outputs.path }}"
        VENV: "${{ runner.temp }}/python-twine-check-action/venv"
        CACHE_DIR: "${{ runner.temp }}/python-twine-check-action/cache"
      run: |
        # Verify Python build artefacts with Twine
        ARTEFACT_PATH="$ENV_PATH_PREFIX/$INPUT_PATH"

        if [ ! -d "$ARTEFACT_PATH" ]; then
          echo "Error: specified directory/path does not exist ❌"
          exit 1
        fi

        # Collect distribution files from the glob directly. nullglob
        # makes the pattern expand to nothing (rather than the literal
        # pattern) when nothing matches, so the count is accurate and
        # filenames containing whitespace or newlines are handled
        # safely without parsing ls output.
        shopt -s nullglob
        artefacts=("$ARTEFACT_PATH"/*)
        shopt -u nullglob

        if [ "${#artefacts[@]}" -eq 0 ]; then
          echo "Error: specified directory/path was empty ❌"
          exit 1
        fi
        echo "Files in specified directory/path: ${#artefacts[@]}"

        # Resolve the pinned twine requirement shipped alongside this
        # action. GITHUB_ACTION_PATH points at the action's own
        # checkout rather than the calling repository, so the pin
        # travels with the action and callers cannot influence it.
        requirements_file="$GITHUB_ACTION_PATH/requirements/twine.txt"
        if [ ! -f "$requirements_file" ]; then
          echo "Error: twine requirements file not found ❌"
          echo "Expected at: $requirements_file"
          exit 1
        fi
        # Take the first line that is neither blank nor a comment.
        twine_requirement="$(grep -vE '^[[:space:]]*(#|$)' \
          "$requirements_file" | head -n 1)"
        if [ -z "$twine_requirement" ]; then
          echo "Error: no twine requirement found in file ❌"
          echo "Searched in: $requirements_file"
          exit 1
        fi

        echo "Using: $twine_requirement"
        # uv starts the interpreter to query it, and Python reads these
        # at startup: PYTHONEXECUTABLE, for one, makes the venv report a
        # workspace interpreter as its own, so drop them all.
        while IFS= read -r name; do
          case "$name" in
            PYTHON*|__PYVENV_LAUNCHER__) unset "$name" ;;
          esac
        done < <(compgen -e)
        # Install the pinned twine into an environment this action owns,
        # built on the trusted interpreter. The explicit --python and
        # --cache-dir stop caller variables (UV_PYTHON, VIRTUAL_ENV,
        # UV_CACHE_DIR and others) choosing the interpreter or feeding
        # it a workspace cache.
        "$UV" venv --no-config --no-project --quiet --clear \
          --cache-dir "$CACHE_DIR" --python "$BASE_PYTHON" -- "$VENV"
        "$UV" pip install --no-config --quiet --cache-dir "$CACHE_DIR" \
          --python "$VENV/bin/python" -- "$twine_requirement"

        echo "Running: twine check on ${#artefacts[@]} artefact(s)"
        # Start twine with -I so PYTHONPATH, PYTHONHOME, user site
        # packages and the working directory cannot inject modules.
        # Terminate option parsing with -- so an artefact name beginning
        # with a dash cannot be interpreted as a twine option.
        if "$VENV/bin/python" -I -m twine check -- "${artefacts[@]}"; then
          echo "Verified Python build artefacts with Twine ✅"
          echo "Verified Python build artefacts with Twine ✅" \
            >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Python build artefacts failed Twine verification ❌"
          exit 1
        fi
